<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practice IT documentation: work through realistic system administration scenarios, record them properly, and check what you captured.">
<!-- app:start -->
<title>SysAdmin Documentation Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: soft neumorphic workbench. One surface colour everywhere; depth comes only from paired light and dark shadows.
   Raised = things you can press or read as objects. Pressed (inset) = places you type into, and the current selection. */
:root {
  --bg: #e4e9f0;
  --surface: #e4e9f0;
  --ink: #273140;
  --muted: #566273;
  --line: rgba(118, 134, 160, .28);
  --hover: rgba(255, 255, 255, .45);
  --hi: rgba(255, 255, 255, .92);
  --lo: rgba(158, 172, 196, .62);
  --accent: #0b6f5f;
  --accent-fill: #0e7a68;
  --accent-ink: #ffffff;
  --stamp: #9c5a00;
  --stamp-soft: rgba(242, 180, 92, .22);
  --ok: #1b7343;
  --warn: #935700;
  --bad: #b0281f;
  --raise: 9px 9px 18px var(--lo), -9px -9px 18px var(--hi);
  --raise-sm: 5px 5px 10px var(--lo), -5px -5px 10px var(--hi);
  --raise-xs: 3px 3px 6px var(--lo), -3px -3px 6px var(--hi);
  --inset: inset 5px 5px 10px var(--lo), inset -5px -5px 10px var(--hi);
  --inset-sm: inset 3px 3px 6px var(--lo), inset -3px -3px 6px var(--hi);
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-lg: 24px;
  --r: 14px;
  --qr-bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262b33; --surface: #262b33; --ink: #dfe5ee; --muted: #9ba7b8; --line: rgba(0, 0, 0, .38); --hover: rgba(255, 255, 255, .035);
    --hi: rgba(255, 255, 255, .06); --lo: rgba(0, 0, 0, .55);
    --accent: #63d6ba; --accent-fill: #5cc9ae; --accent-ink: #0d221c; --stamp: #f2b45c; --stamp-soft: rgba(242, 180, 92, .14);
    --ok: #74d69e; --warn: #f1b552; --bad: #ff8c80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262b33; --surface: #262b33; --ink: #dfe5ee; --muted: #9ba7b8; --line: rgba(0, 0, 0, .38); --hover: rgba(255, 255, 255, .035);
  --hi: rgba(255, 255, 255, .06); --lo: rgba(0, 0, 0, .55);
  --accent: #63d6ba; --accent-fill: #5cc9ae; --accent-ink: #0d221c; --stamp: #f2b45c; --stamp-soft: rgba(242, 180, 92, .14);
  --ok: #74d69e; --warn: #f1b552; --bad: #ff8c80;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 104px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
[hidden] { display: none !important; }
a { color: var(--accent); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.75rem, 3.4vw, 2.3rem); font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--accent); }
.lead { color: var(--muted); font-size: 1.05rem; max-width: 64ch; }
.spacer { flex: 1; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* App bar: a raised bar floating on the page */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
.appbar .appbar-inner { display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap; padding: 10px 14px 10px 18px; border-radius: 20px; box-shadow: var(--raise); }
.brand { display: flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.brand svg { width: 40px; height: 40px; padding: 7px; border-radius: 12px; color: var(--accent); box-shadow: var(--raise-xs); flex: none; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 5px; border-radius: 16px; box-shadow: var(--inset-sm); }
.tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 12px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14.5px; transition: box-shadow .15s, color .15s; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent); box-shadow: var(--raise-xs); }
.count { font: 500 12px/1.6 var(--font-mono); min-width: 22px; padding: 0 6px; border-radius: 99px; text-align: center; box-shadow: var(--inset-sm); color: var(--muted); }
.clock { margin-left: auto; display: flex; gap: 8px; align-items: baseline; padding: 8px 14px; border-radius: 12px; box-shadow: var(--inset-sm); font: 400 13px/1.3 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock strong { color: var(--ink); font-weight: 500; font-size: 14px; }
.show-sm { display: none; }
@media (max-width: 620px) {
  .tabs { width: 100%; }
  .tabs a { flex: 1; justify-content: center; padding: 7px 8px; }
  .tabs .hide-sm { display: none; }
  .tabs .show-sm { display: inline; }
}
@media (max-width: 820px) {
  .appbar { position: static; }
  html { scroll-padding-top: 16px; }
  .clock { margin-left: 0; }
}

main.wrap { padding-block: 18px 80px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--bg); color: var(--ink); box-shadow: var(--raise-sm); font: 700 14px/1.2 var(--font-body); cursor: pointer; text-decoration: none; white-space: nowrap; transition: box-shadow .15s, color .15s, transform .15s; }
.btn:hover { color: var(--accent); }
.btn:active { box-shadow: var(--inset-sm); transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: default; box-shadow: var(--raise-xs); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-primary { background: var(--accent-fill); color: var(--accent-ink); box-shadow: 5px 5px 12px var(--lo), -5px -5px 12px var(--hi); }
.btn-primary:hover { color: var(--accent-ink); filter: brightness(1.06); }
.btn-primary:active { box-shadow: inset 3px 3px 7px rgba(0, 0, 0, .25), inset -2px -2px 6px rgba(255, 255, 255, .18); }
.btn-ghost { box-shadow: none; color: var(--muted); }
.btn-ghost:hover { box-shadow: var(--raise-xs); }
.btn-danger, .btn-danger:hover { color: var(--bad); }
.btn-sm { min-height: 32px; padding: 0 13px; font-size: 13px; border-radius: 10px; }

/* Chips: small pressed pills */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 99px; box-shadow: var(--inset-sm); font-size: 12px; font-weight: 700; line-height: 1.7; color: var(--muted); white-space: nowrap; }
.chip-code { color: var(--accent); }
.sev-low { color: var(--muted); }
.sev-medium { color: var(--warn); }
.sev-high { color: var(--bad); }
.sev-critical { background: var(--bad); color: var(--surface); box-shadow: var(--raise-xs); }
.st-open, .st-pending { color: var(--warn); }
.st-in-progress { color: var(--accent); }
.st-resolved, .st-closed { color: var(--ok); }
.chip-example { color: var(--stamp); }

.pane { padding: 22px; border-radius: var(--r-lg); box-shadow: var(--raise); }
.pane h3 { margin-bottom: 4px; }
.stack { display: flex; flex-direction: column; gap: 22px; }

/* Scenarios view */
.intro { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: center; padding: 14px 0 10px; }
.intro .lead { margin-top: 12px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: step; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 16px; border-radius: 18px; box-shadow: var(--raise-sm); }
.steps li::before { content: counter(step); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; box-shadow: var(--inset-sm); font: 500 14px var(--font-mono); color: var(--accent); }
.steps b { font-weight: 800; }
@media (max-width: 860px) { .intro { grid-template-columns: minmax(0, 1fr); } }

.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 40px 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 26px; }
.card { display: flex; flex-direction: column; gap: 12px; padding: 22px; border-radius: var(--r-lg); box-shadow: var(--raise); transition: box-shadow .2s, transform .2s; }
.card:hover { transform: translateY(-2px); box-shadow: 12px 12px 24px var(--lo), -12px -12px 24px var(--hi); }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.card h3 { font-size: 1.15rem; font-weight: 800; }
.card p { color: var(--muted); font-size: 14.5px; }
.card-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 8px; }
.done { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ok); }
.done svg { width: 14px; height: 14px; }

.banner { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 26px; padding: 16px 20px; border-radius: 18px; box-shadow: var(--inset); }
.banner p { flex: 1 1 260px; color: var(--stamp); font-weight: 600; }
.blank { margin-top: 40px; padding: 24px; border-radius: var(--r-lg); box-shadow: var(--inset); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: center; }
.blank p { color: var(--muted); margin-top: 4px; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
@media (max-width: 760px) { .blank { grid-template-columns: minmax(0, 1fr); } }

/* Practice view */
.practice-head { display: flex; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; margin: 6px 0 24px; }
.practice-head h1 { margin-top: 4px; }
.id-preview { font: 400 13px var(--font-mono); color: var(--muted); padding: 8px 14px; border-radius: 12px; box-shadow: var(--inset-sm); }
.id-preview b { color: var(--ink); font-weight: 500; }
.workbench { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 28px; align-items: start; }
.workbench.single { grid-template-columns: minmax(0, 860px); justify-content: center; }
.feed-pane { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 104px); max-height: calc(100vh - 124px); overflow-y: auto; }
@media (max-width: 980px) { .workbench { grid-template-columns: minmax(0, 1fr); } .feed-pane { position: static; max-height: none; } }
.feed-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sim-date { font: 400 12.5px var(--font-mono); color: var(--muted); }
.role { margin-top: 12px; padding: 12px 14px; border-radius: 14px; box-shadow: var(--inset-sm); font-size: 14px; color: var(--muted); }
.feed { list-style: none; margin: 10px 0 0; padding: 0; }
.event { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 14px; padding: 16px 8px; border-top: 1px solid var(--line); border-radius: 14px; }
.event:first-child { border-top: 0; }
.event-time { align-self: start; text-align: center; padding: 5px 0; border-radius: 10px; box-shadow: var(--inset-sm); font: 500 14px/1.4 var(--font-mono); color: var(--stamp); font-variant-numeric: tabular-nums; }
.event-ch { font-size: 12px; font-weight: 700; color: var(--muted); }
.event-from { font-weight: 700; margin-top: 1px; }
.event-body { margin-top: 4px; white-space: pre-line; overflow-wrap: anywhere; }
.event.fresh { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { background: var(--stamp-soft); } to { background: transparent; } }
.feed-more { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 16px; border-top: 1px solid var(--line); }
.feed-end { padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }

.form-group { padding: 20px 22px 22px; border-radius: var(--r-lg); box-shadow: var(--raise); }
.group-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
.group-title h2 { font-size: 1.05rem; }
.group-title .w { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.field { min-width: 0; }
.field.wide { grid-column: 1 / -1; }
@media (max-width: 620px) { .fields { grid-template-columns: minmax(0, 1fr); } }
label, .label { display: block; font-weight: 700; font-size: 13.5px; margin-bottom: 7px; }
.req { color: var(--bad); }
input[type="text"], input[type="search"], input[type="password"], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 14px; border: 0; border-radius: var(--r);
  background: var(--bg); color: var(--ink); box-shadow: var(--inset-sm); font: 15px/1.45 var(--font-body);
  transition: box-shadow .15s;
}
input:focus, select:focus, textarea:focus { outline: none; box-shadow: var(--inset-sm), 0 0 0 2px var(--accent); }
select { cursor: pointer; }
input.dt { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
input[aria-invalid="true"] { box-shadow: var(--inset-sm), 0 0 0 2px var(--warn); }
textarea { resize: vertical; display: block; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
.field.invalid input, .field.invalid select, .field.invalid textarea { box-shadow: var(--inset-sm), 0 0 0 2px var(--bad); }
.field.invalid label { color: var(--bad); }
.help { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.input-row { display: flex; gap: 10px; align-items: center; }
.input-row input { flex: 1; min-width: 0; }
.tl-list { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 12px; counter-reset: tl; }
.tl-row { display: grid; grid-template-columns: 30px 150px minmax(0, 1fr) auto; gap: 10px; align-items: start; counter-increment: tl; }
.tl-row::before { content: counter(tl); display: grid; place-items: center; width: 30px; height: 30px; margin-top: 7px; border-radius: 50%; box-shadow: var(--raise-xs); font: 500 12px var(--font-mono); color: var(--muted); }
.tl-time { display: flex; gap: 6px; align-items: center; }
.tl-time input { min-width: 0; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; margin-top: 2px; border: 0; border-radius: 12px; background: var(--bg); color: var(--muted); cursor: pointer; transition: box-shadow .15s, color .15s; }
.icon-btn:hover { color: var(--bad); box-shadow: var(--raise-xs); }
.icon-btn:active { box-shadow: var(--inset-sm); }
.icon-btn svg { width: 16px; height: 16px; }
@media (max-width: 620px) {
  .tl-row { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .tl-row .tl-time { grid-column: 2; grid-row: 1; }
  .tl-row .icon-btn { grid-column: 3; grid-row: 1; }
  .tl-row textarea { grid-column: 2 / -1; grid-row: 2; }
}
.empty-tl { color: var(--muted); font-size: 14px; padding: 12px 14px; border-radius: 14px; box-shadow: var(--inset-sm); margin-bottom: 14px; }
.formbar { position: sticky; bottom: 12px; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-radius: 20px; background: var(--bg); box-shadow: var(--raise); }
.draft-status { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 12.5px var(--font-mono); color: var(--muted); }
.formbar .draft-status + .spacer { display: none; }
@media (max-width: 620px) {
  .formbar { gap: 8px; padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .formbar .btn { padding: 0 13px; }
  .formbar .draft-status, .hide-sm { display: none; }
}

/* Documentation check */
.score { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-top: 14px; }
.score-num { display: grid; place-items: center; align-content: center; width: 116px; height: 116px; border-radius: 50%; box-shadow: var(--inset); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; flex: none; }
.score-num span { font-size: 16px; color: var(--muted); font-weight: 700; margin-top: 4px; }
.score-text { flex: 1 1 220px; }
.score-text strong { font-size: 1.15rem; font-weight: 800; }
.meter { height: 12px; margin-top: 12px; border-radius: 99px; box-shadow: var(--inset-sm); padding: 2px; }
.meter span { display: block; height: 100%; min-width: 8px; background: var(--accent-fill); border-radius: 99px; }
.w-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
.w-tile { padding: 10px 12px; border-radius: 14px; box-shadow: var(--raise-xs); text-align: center; }
.w-tile span { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.w-tile b { font: 500 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.w-tile.full { box-shadow: var(--inset-sm); }
.w-tile.full b { color: var(--ok); }
.w-tile.none b { color: var(--bad); }
@media (max-width: 620px) { .w-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.checklist { list-style: none; margin: 12px 0 0; padding: 0; }
.checklist li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.checklist li:first-child { border-top: 0; }
.mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; box-shadow: var(--raise-xs); }
.mark svg { width: 12px; height: 12px; }
.lvl-ok .mark { color: var(--ok); }
.lvl-bad .mark { color: var(--bad); }
.lvl-warn .mark { color: var(--warn); }
.fact-w { font-size: 12.5px; font-weight: 800; color: var(--muted); margin-right: 8px; }
.hint { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
.notice { padding: 13px 16px; border-radius: 14px; box-shadow: var(--inset-sm); color: var(--warn); font-size: 14px; font-weight: 600; margin-top: 18px; }

/* Document view */
.doc { padding: clamp(20px, 3vw, 34px); border-radius: var(--r-lg); box-shadow: var(--raise); }
.doc-head { padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.doc-head h2 { font-size: clamp(1.35rem, 2.6vw, 1.8rem); margin-top: 6px; }
.doc-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin: 18px 0 0; }
.doc-meta > div { padding: 10px 14px; border-radius: 14px; box-shadow: var(--inset-sm); min-width: 0; }
.doc-meta dt { font-size: 12px; font-weight: 700; color: var(--muted); }
.doc-meta dd { margin: 3px 0 0; font-weight: 700; font-size: 14.5px; overflow-wrap: anywhere; }
.doc-section { margin-top: 26px; }
.doc-section h3 { font-size: 1rem; font-weight: 800; color: var(--accent); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 4px 18px; padding: 11px 0; border-bottom: 1px solid var(--line); margin: 0; }
.kv dt { font-weight: 700; font-size: 14px; color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.not-recorded { color: var(--bad); font-style: italic; font-size: 14px; }
@media (max-width: 620px) { .kv { grid-template-columns: minmax(0, 1fr); } }
.table-wrap { overflow-x: auto; border-radius: 18px; box-shadow: var(--inset-sm); padding: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 12.5px; font-weight: 800; color: var(--muted); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.t { font-family: var(--font-mono); color: var(--stamp); font-weight: 500; white-space: nowrap; width: 1%; }
td.nowrap { white-space: nowrap; }
.doc .table-wrap { margin-top: 12px; }
.record-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 22px; }
.check-summary { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
details.md { margin-top: 22px; }
details.md summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
details.md pre { margin: 10px 0 0; padding: 16px; overflow-x: auto; border-radius: 16px; box-shadow: var(--inset-sm); font: 13px/1.55 var(--font-mono); white-space: pre; }

/* Records view */
.page-head { display: flex; align-items: flex-end; gap: 14px 24px; flex-wrap: wrap; margin: 6px 0 24px; }
.page-head .lead { margin-top: 10px; }
.toolbar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
.toolbar input[type="search"] { flex: 1 1 260px; width: auto; }
.toolbar select { width: auto; flex: 0 1 200px; }
.store-mode { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.store-mode i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); display: inline-block; box-shadow: 0 0 6px var(--ok); }
.store-mode.local i { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
.records tbody tr { cursor: pointer; }
.records tbody tr:hover td { background: var(--hover); }
.records td a { color: var(--ink); text-decoration: none; font-weight: 700; }
.records td a:hover { color: var(--accent); text-decoration: underline; }
.new-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; font-size: 14px; color: var(--muted); }
.empty { text-align: center; padding: 48px 20px; border-radius: var(--r-lg); box-shadow: var(--inset); }
.empty h2 { margin-bottom: 8px; }
.empty p { color: var(--muted); max-width: 52ch; margin: 0 auto 20px; }
.empty .btn-row { justify-content: center; }

/* Guide */
.guide { display: grid; gap: 26px; }
.guide > * { min-width: 0; }
.guide .table-wrap td:first-child { font-weight: 800; white-space: nowrap; }
.rules { margin: 12px 0 0; padding-left: 22px; display: grid; gap: 8px; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 14px; }
.compare > div { padding: 16px 18px; border-radius: 16px; box-shadow: var(--inset-sm); }
.compare h3 { font-size: .95rem; margin-bottom: 6px; }
.compare .bad-ex h3 { color: var(--bad); }
.compare .good-ex h3 { color: var(--ok); }
@media (max-width: 700px) { .compare { grid-template-columns: minmax(0, 1fr); } }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: min(560px, calc(100vw - 32px)); transform: translate(-50%, 16px); opacity: 0; pointer-events: none; padding: 13px 20px; border-radius: 16px; background: var(--bg); color: var(--ink); font-size: 14px; font-weight: 600; box-shadow: var(--raise); transition: opacity .18s, transform .18s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Class review */
.share { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 26px; align-items: center; margin-bottom: 26px; }
.qr { width: 196px; height: 196px; padding: 14px; border-radius: 20px; background: var(--qr-bg); box-shadow: var(--raise); display: grid; place-items: center; }
.qr img, .qr canvas { display: block; width: 168px; height: 168px; }
.link-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.link-row code { flex: 1 1 240px; min-width: 0; padding: 10px 14px; border-radius: 12px; box-shadow: var(--inset-sm); font: 13px/1.4 var(--font-mono); overflow-wrap: anywhere; }
.code-form { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.code-form input { flex: 1 1 220px; width: auto; }
.sub-head { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.sub-meta { display: flex; gap: 6px 20px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin-top: 8px; }
.mini-meter { display: inline-block; width: 64px; height: 8px; margin-left: 10px; vertical-align: middle; border-radius: 99px; box-shadow: var(--inset-sm); padding: 1px; }
.mini-meter span { display: block; height: 100%; border-radius: 99px; background: var(--accent-fill); }
.toggle { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent-fill); }
.chip-sent { color: var(--ok); }
.records tbody tr[data-sub] { cursor: pointer; }
.records tbody tr[data-sub]:hover td { background: var(--hover); }
@media (max-width: 700px) { .share { grid-template-columns: minmax(0, 1fr); } .qr { margin: 0 auto; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  // Accept 9:42, 0942, 9.42, 2:05 pm ... and return 24-hour HH:MM ('' if empty, null if unreadable).

    if (!m) return null;

    const date = m[1] + '-' + pad(mo) + '-' + pad(d);

    const t = normTime(m[4]);

  }

  const PRACTICE = SCENARIOS.filter((s) => s.set !== 'class');
  const CLASS_SET = SCENARIOS.filter((s) => s.set === 'class');
  const scenarioOptions = (selected) =>
    '<optgroup label="Class activity">' + CLASS_SET.map((s) => '<option value="' + s.id + '"' + (selected === s.id ? ' selected' : '') + '>' + esc(s.title) + '</option>').join('') + '</optgroup>' +
    '<optgroup label="Practice">' + PRACTICE.map((s) => '<option value="' + s.id + '"' + (selected === s.id ? ' selected' : '') + '>' + esc(s.title) + '</option>').join('') + '</optgroup>';

  /* ---------------------------------------------------------------- storage */
  // Records live in this viewer's private store when the page runs as a Claude
  // artifact, and in the browser's localStorage everywhere else (GitHub Pages, a file).
  const store = {
    mode: 'local', ready: false, records: [], col: null,
    loadLocal() { try { return JSON.parse(LS.get(KEY_RECORDS) || '[]'); } catch (e) { return []; } },
    saveLocal() { LS.set(KEY_RECORDS, JSON.stringify(this.records)); },
    async init() {
      const host = window.claude && typeof window.claude.use === 'function';
      if (!host) { this.useLocal(); return; }
      try {
        const res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        const db = res[0], user = res[1];
        const uid = user ? await user.id() : null;
        if (db && uid) {
          this.col = db.collection('data/users/' + uid);
          this.mode = 'cloud';
          this.col.onSnapshot((snap) => {
            this.records = snap.docs.map((d) => clone(d.data()));
            this.ready = true;
            changed();
          }, () => this.useLocal());
          return;
        }
      } catch (e) { /* fall through to local */ }
      this.useLocal();
    },
    useLocal() { this.mode = 'local'; this.col = null; this.records = this.loadLocal(); this.ready = true; changed(); },
    upsert(rec) { const i = this.records.findIndex((r) => r.id === rec.id); if (i >= 0) this.records[i] = rec; else this.records.push(rec); },
    async save(rec) {
      const body = clone(rec);
      if (this.mode === 'cloud') {
        try { await this.col.doc(rec.id).set(body); this.upsert(body); return; } catch (e) {
          if (e && e.code === 'unavailable') {
            try { await sleep(400 + Math.random() * 600); await this.col.doc(rec.id).set(body); this.upsert(body); return; } catch (e2) { /* fall back */ }
          }
          if (e && e.code === 'quota_exceeded') { toast('Storage is full. Delete some old records, then save again.'); throw e; }
          this.useLocal();
          toast('Could not save to your account, so this record is saved in this browser.');
        }
      }
      this.upsert(body);
      this.saveLocal();
    },
    async remove(id) {
      if (this.mode === 'cloud') {
        await this.col.doc(id).delete();
        this.records = this.records.filter((r) => r.id !== id);
        return;
      }
      this.records = this.records.filter((r) => r.id !== id);
      this.saveLocal();
    }
  };

  function nextId(prefix) {
    const year = new Date().getFullYear();
    const head = prefix + '-' + year + '-';
    const max = store.records.reduce((m, r) => r.id && r.id.indexOf(head) === 0 ? Math.max(m, parseInt(r.id.slice(head.length), 10) || 0) : m, 0);
    return head + String(max + 1).padStart(4, '0');
  }

  /* ------------------------------------------------------------------ draft */
  let draft = null;
  let draftTimer = null;
  function loadDraft() { try { draft = JSON.parse(LS.get(KEY_DRAFT) || 'null'); } catch (e) { draft = null; } }
  function persistDraft() { if (draft) LS.set(KEY_DRAFT, JSON.stringify(draft)); }
  function saveDraftSoon() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => {
      persistDraft();
      const el = $('#draft-status');
      if (el) el.textContent = 'Draft saved ' + new Date().toTimeString().slice(0, 8);
    }, 400);
  }
  function clearDraft() { clearTimeout(draftTimer); draft = null; LS.del(KEY_DRAFT); }

  function newDraft(opts) {
    const today = ymd(new Date());
    const sc = opts.scenarioId ? scenarioById(opts.scenarioId) : null;
    return {
      mode: opts.mode, scenarioId: sc ? sc.id : null, template: sc ? sc.template : opts.template,
      scenarioDate: sc ? today : null, revealed: sc ? 1 : 0,
      fields: {}, timeline: sc ? [{ t: '', a: '' }] : [{ t: hm(new Date()), a: '' }],
      author: LS.get(KEY_AUTHOR) || '', changeNote: '', editingId: null, startedAt: new Date().toISOString()
    };
  }

  /* ----------------------------------------------------------------- checks */
  const recordText = (d) => [].concat(Object.values(d.fields || {}), (d.timeline || []).map((e) => (e.t || '') + ' ' + (e.a || ''))).join('\n').toLowerCase();
  function factOk(f, d, text) {
    if (f.check) return !!f.check(d, text);
    const test = (p) => p instanceof RegExp ? p.test(text) : text.indexOf(String(fill(p, d.scenarioDate)).toLowerCase()) !== -1;
    const all = f.all || [], any = f.any || [];
    return all.every(test) && (any.length === 0 || any.some(test));
  }
  function requiredMissing(d) {
    const missing = [];
    if (!String(d.author || '').trim()) missing.push('Documented by');
    TEMPLATES[d.template].fields.forEach((k) => { if (FIELDS[k].req && !has(d, k)) missing.push(labelFor(d.template, k)); });
    return missing;
  }
  function evaluate(d) {
    const sc = scenarioById(d.scenarioId);
    const tpl = TEMPLATES[d.template];
    const f = d.fields || {};
    const text = recordText(d);
    const facts = sc ? sc.facts.map((x) => ({ w: x.w, label: fill(x.label, d.scenarioDate), hint: x.hint ? fill(x.hint, d.scenarioDate) : '', ok: factOk(x, d, text) })) : [];
    const found = facts.filter((x) => x.ok).length;
    const checks = [];
    const ok = (t) => checks.push({ lvl: 'ok', text: t });
    const bad = (t) => checks.push({ lvl: 'bad', text: t });
    const warn = (t) => checks.push({ lvl: 'warn', text: t });
    const missing = requiredMissing(d);
    if (missing.length) bad('Required fields are empty: ' + missing.join(', ') + '.'); else ok('All required fields are filled in.');
    const tl = (d.timeline || []).filter((e) => (e.t || '').trim() || (e.a || '').trim());
    const minTl = sc ? Math.min(4, sc.events.length) : 1;
    if (tl.length >= minTl) ok('The timeline has ' + tl.length + (tl.length === 1 ? ' entry.' : ' entries.'));
    else bad('The timeline has ' + tl.length + (tl.length === 1 ? ' entry' : ' entries') + '. Record each update and action as its own entry (at least ' + minTl + ').');
    const noTime = tl.filter((e) => !(e.t || '').trim()).length;
    if (tl.length) { if (noTime) bad(noTime + (noTime === 1 ? ' timeline entry has' : ' timeline entries have') + ' no time.'); else ok('Every timeline entry has a time.'); }
    const noText = tl.filter((e) => !(e.a || '').trim()).length;
    if (noText) bad(noText + (noText === 1 ? ' timeline entry has' : ' timeline entries have') + ' a time but no description.');
    const times = tl.map((e) => e.t).filter(Boolean);
    if (times.length > 1) { if (times.every((t, i) => i === 0 || t >= times[i - 1])) ok('Timeline entries are in time order.'); else warn('Timeline entries are not in time order.'); }
    const dtBad = ['occurred', 'resolved'].filter((k) => f[k] && !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(String(f[k]).replace('T', ' ')));
    const tBad = tl.filter((e) => e.t && !/^\d{2}:\d{2}$/.test(e.t)).length;
    if (dtBad.length || tBad) warn('Some dates or times are not in the standard format. Use YYYY-MM-DD HH:MM with 24-hour time.');
    else if (f.occurred || times.length) ok('Dates and times use the standard format (YYYY-MM-DD, 24-hour).');
    if (f.occurred && f.resolved) { if (f.resolved >= f.occurred) ok('The resolved time is after the reported time.'); else bad('The resolved time is before the reported time.'); }
    if (['Resolved', 'Closed'].includes(f.status) && tpl.fields.includes('resolved') && !f.resolved) warn('Status is ' + f.status + ', but no resolved date and time is recorded.');
    if (f.status === 'Open' && f.resolved) warn('A resolved time is recorded, but the status is still Open.');
    if (tpl.fields.includes('cause') && !String(f.cause || '').trim()) warn('Cause is empty. If it is unknown, write “Unknown, under investigation”.');
    if (/\b(password|passwd|pwd)\s*(is|:|=)\s*\S+/i.test(text)) bad('It looks like a password was written down. Never record passwords in documentation.');
    return { facts, found, total: facts.length, checks, unrevealed: sc ? sc.events.length - d.revealed : 0 };
  }
  const asDraft = (rec) => {
    const sc = scenarioById(rec.scenarioId);
    return { scenarioId: rec.scenarioId, template: rec.template, scenarioDate: rec.scenarioDate, revealed: sc ? sc.events.length : 0, fields: rec.fields || {}, timeline: rec.timeline || [], author: rec.author || '' };
  };
  const verdict = (pct) => pct >= 90 ? 'Excellent record' : pct >= 70 ? 'Good, with a few details missing' : pct >= 50 ? 'Needs more detail' : 'Important facts are missing';

  function modelRecord(sc, date) {
    const fields = {};
    Object.keys(sc.model).forEach((k) => { if (k !== 'timeline') fields[k] = fill(sc.model[k], date); });
    return { id: 'Example', template: sc.template, fields, timeline: sc.model.timeline.map((e) => ({ t: e[0], a: fill(e[1], date) })), author: 'Example answer', scenarioId: sc.id, scenarioDate: date };
  }

  /* -------------------------------------------------------------- rendering */
  const app = $('#app');
  const state = {
    view: 'scenarios', recordId: null, review: null, showExample: false, pendingStart: null, confirmDelete: false, confirmReset: false,
    filters: { q: '', type: '', status: '' },
    cls: { items: null, loading: false, error: '', openId: null, order: [], scenario: '', sort: 'newest', auto: false, updated: null, share: '', confirmClear: false, confirmDel: false }
  };

  const sevChip = (v) => v ? '<span class="chip sev-' + slug(v) + '">' + esc(v) + '</span>' : '';
  const stChip = (v) => v ? '<span class="chip st-' + slug(v) + '">' + esc(v) + '</span>' : '';

  function render() {
    $$('.tabs a').forEach((a) => {
      const tab = a.dataset.tab;
      const on = tab === state.view || (tab === 'records' && state.view === 'record') || (tab === 'scenarios' && (state.view === 'practice' || state.view === 'class'));
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    $('#rec-count').textContent = store.ready ? String(store.records.length) : '…';
    if (state.view === 'practice' && draft) app.innerHTML = practiceView();
    else if (state.view === 'records') app.innerHTML = recordsView();
    else if (state.view === 'record') app.innerHTML = recordView();
    else if (state.view === 'guide') app.innerHTML = guideView();
    else if (state.view === 'review') app.innerHTML = classView();
    else if (state.view === 'class') app.innerHTML = classActivityView();
    else app.innerHTML = scenariosView();
    if (state.view === 'review') drawQR();
    syncAuto();
  }

  function changed() {
    $('#rec-count').textContent = String(store.records.length);
    if (state.view === 'records') {
      const rows = $('#rec-rows');
      if (!rows) { render(); return; }
      rows.innerHTML = recordRows();
      renderStoreMode();
      const ex = $('[data-action="export-all"]'); if (ex) ex.disabled = !store.records.length;
      const rs = $('[data-action="reset-all"]'); if (rs) rs.disabled = !(store.records.length || draft);
    }
    else if (state.view === 'record' || state.view === 'scenarios' || state.view === 'class') render();
  }

  /* Scenarios */
  function bestCheck(scId) {
    const done = store.records.filter((r) => r.scenarioId === scId && r.check && !r.example);
    if (!done.length) return null;
    return done.reduce((b, r) => (r.check.found / r.check.total) > (b.found / b.total) ? r.check : b, done[0].check);
  }
  function cardHTML(s) {
    const t = TEMPLATES[s.template];
    const best = store.ready ? bestCheck(s.id) : null;
    return '<article class="card">' +
      '<div class="card-top"><span class="chip chip-code" title="' + esc(t.label) + '">' + t.prefix + '</span><span class="chip">' + esc(s.level) + '</span><span class="muted">' + s.events.length + ' updates · about ' + s.minutes + ' min</span></div>' +
      '<h3>' + esc(s.title) + '</h3><p>' + esc(s.summary) + '</p>' +
      '<p class="muted" style="font-size:13px">Document as: <strong>' + esc(t.label) + '</strong></p>' +
      '<div class="card-foot">' + (best ? '<span class="done" title="Your best documentation check">' + ICON.check + 'Done · ' + best.found + '/' + best.total + '</span>' : '') +
      '<span class="spacer"></span><button class="btn btn-primary btn-sm" data-action="start" data-id="' + s.id + '">' + (best ? 'Try again' : 'Start scenario') + '</button></div>' +
      '</article>';
  }

  // The page the class link opens: only the class scenarios.
  function classActivityView() {
    return '<section class="intro"><div><p class="eyebrow">Class activity</p><h1>Pick a scenario and document it.</h1>' +
      '<p class="lead">Read each update as it comes in and write it down properly: the date and time, who, what, where, why and how. When you’re done, submit your record so the class can review it together.</p></div>' +
      '<ol class="steps"><li><span><b>Choose</b> one of the scenarios below.</span></li><li><span><b>Document</b> it, and type your name in <b>Documented by</b>.</span></li><li><span><b>Submit to class</b> when your record is complete.</span></li></ol></section>' +
      (draft ? '<div class="banner"><p>You have unsaved documentation in progress.</p><div class="btn-row"><button class="btn btn-primary btn-sm" data-action="resume">Resume</button></div></div>' : '') +
      '<div class="section-head"><h2>Class activity scenarios</h2><span class="muted">' + CLASS_SET.length + ' scenarios</span></div>' +
      '<div class="grid">' + CLASS_SET.map(cardHTML).join('') + '</div>';
  }

  function scenariosView() {
    const sc = draft && draft.scenarioId ? scenarioById(draft.scenarioId) : null;
    const draftName = draft ? (draft.mode === 'edit' ? 'your edit of ' + draft.editingId : sc ? 'the scenario “' + sc.title + '”' : 'a blank ' + TEMPLATES[draft.template].label) : '';
    let banner = '';
    if (draft && state.pendingStart) {
      banner = '<div class="banner" role="alert"><p>Starting a new record will discard your unsaved work on ' + esc(draftName) + '.</p>' +
        '<div class="btn-row"><button class="btn btn-primary btn-sm" data-action="confirm-start">Discard and start</button><button class="btn btn-sm" data-action="resume">Keep working on it</button><button class="btn btn-ghost btn-sm" data-action="cancel-start">Cancel</button></div></div>';
    } else if (draft) {
      banner = '<div class="banner"><p>You have unsaved documentation for ' + esc(draftName) + '.</p><div class="btn-row"><button class="btn btn-primary btn-sm" data-action="resume">Resume</button></div></div>';
    }
    const cards = PRACTICE.map(cardHTML).join('');
    const blanks = Object.keys(TEMPLATES).map((k) => '<button class="btn btn-sm" data-action="blank" data-template="' + k + '">' + esc(TEMPLATES[k].label) + '</button>').join('');
    return '<section class="intro"><div><p class="eyebrow">Documentation practice for system administrators</p><h1>Read the situation. Write it down properly.</h1>' +
      '<p class="lead">Pick a scenario. Updates arrive one at a time, each with its own time stamp. Document them the way a system administrator should, then check your record against the facts that matter.</p></div>' +
      '<ol class="steps"><li><span><b>Read</b> each update as the situation unfolds.</span></li><li><span><b>Document</b> the date, time, who, what, where, why and how.</span></li><li><span><b>Check</b> what you captured, save or submit the record, then compare it with an example answer.</span></li></ol></section>' +
      banner +
      '<div class="section-head"><h2>Practice scenarios</h2><span class="muted">' + PRACTICE.length + ' situations from a system administrator’s day</span></div>' +
      '<div class="grid">' + cards + '</div>' +
      '<div class="section-head"><h2>Class activity</h2><span class="muted">' + CLASS_SET.length + ' new scenarios kept for the class, so nobody has seen the answers yet</span></div>' +
      '<div class="grid">' + CLASS_SET.map(cardHTML).join('') + '</div>' +
      '<section class="blank"><div><h2>Document a real event</h2><p>Start a blank record from a template. The <strong>Now</strong> buttons stamp the current date and time.</p></div><div class="btn-row">' + blanks + '</div></section>';
  }

  /* Practice */
  function practiceView() {
    const sc = scenarioById(draft.scenarioId);
    const tpl = TEMPLATES[draft.template];
    const heading = draft.mode === 'edit' ? 'Editing ' + draft.editingId : sc ? sc.title : 'New ' + tpl.label;
    const idInfo = draft.mode === 'edit' ? 'Record ID <b>' + esc(draft.editingId) + '</b>' : 'Record ID <b>' + esc(nextId(tpl.prefix)) + '</b> · assigned on save';
    const right = state.review ? reviewHTML() : formHTML();
    return '<div class="practice-head"><div><p class="eyebrow">' + esc(tpl.label) + (sc ? ' · Scenario' : '') + '</p><h1>' + esc(heading) + '</h1></div><span class="spacer"></span><span class="id-preview">' + idInfo + '</span>' +
      '<button type="button" class="btn btn-sm" data-action="restart">' + (draft.mode === 'edit' ? 'Undo changes' : 'Start over') + '</button></div>' +
      '<div class="workbench' + (sc ? '' : ' single') + '">' + (sc ? '<aside class="feed-pane pane" id="feed-pane" aria-label="Scenario">' + feedHTML(sc) + '</aside>' : '') +
      '<section class="stack" id="form-pane">' + right + '</section></div>';
  }

  function feedHTML(sc, fresh) {
    const shown = sc.events.slice(0, draft.revealed);
    const rest = sc.events.length - draft.revealed;
    const items = shown.map((e, i) => '<li class="event' + (fresh && i === shown.length - 1 ? ' fresh' : '') + '"><div class="event-time">' + esc(e.t) + '</div><div><div class="event-ch">' + esc(e.ch) + '</div><div class="event-from">' + esc(fill(e.from, draft.scenarioDate)) + '</div><div class="event-body">' + esc(fill(e.body, draft.scenarioDate)) + '</div></div></li>').join('');
    const more = rest > 0
      ? '<div class="feed-more"><button class="btn btn-primary btn-sm" data-action="reveal">Show next update</button><span class="muted">' + rest + ' more</span><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-action="reveal-all">Show all</button></div>'
      : '<p class="feed-end">That’s the whole scenario. Finish your record, then check it.</p>';
    return '<div class="feed-head"><span class="eyebrow">Situation</span><span class="sim-date">' + esc(dayName(draft.scenarioDate)) + ', ' + esc(draft.scenarioDate) + ' · ' + esc(tzLabel) + '</span></div>' +
      '<p class="role">' + esc(sc.role) + '</p><ol class="feed" aria-live="polite">' + items + '</ol>' + more;
  }

  function fieldHTML(key) {
    const f = FIELDS[key];
    const label = labelFor(draft.template, key);
    if (f.type === 'timeline') return timelineFieldHTML(label);
    const v = draft.fields[key] || '';
    const id = 'f-' + key;
    const wide = f.type === 'textarea' || f.wide ? ' wide' : '';
    const req = f.req ? ' <span class="req" aria-hidden="true">*</span>' : '';
    let help = f.help || '';
    if (f.type === 'datetime') help = (draft.scenarioId ? 'Use the date and time from the scenario. ' : '') + 'Format: YYYY-MM-DD HH:MM, 24-hour.';
    let ctl;
    if (f.type === 'textarea') ctl = '<textarea id="' + id + '" data-field="' + key + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.ph || '') + '"' + (f.req ? ' aria-required="true"' : '') + '>' + esc(v) + '</textarea>';
    else if (f.type === 'select') ctl = '<select id="' + id + '" data-field="' + key + '"' + (f.req ? ' aria-required="true"' : '') + '><option value="">Select…</option>' + f.options.map((o) => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
    else if (f.type === 'datetime') ctl = '<div class="input-row"><input id="' + id + '" class="dt" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="20" placeholder="YYYY-MM-DD HH:MM" data-field="' + key + '" data-kind="datetime" value="' + esc(v) + '"' + (f.req ? ' aria-required="true"' : '') + '><button type="button" class="btn btn-sm" data-action="now-field" data-field="' + key + '" title="Fill in the current date and time">Now</button></div>';
    else ctl = '<input id="' + id + '" type="text" data-field="' + key + '" value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '"' + (f.req ? ' aria-required="true"' : '') + '>';
    return '<div class="field' + wide + '" data-key="' + key + '"><label for="' + id + '">' + esc(label) + req + '</label>' + ctl + (help ? '<p class="help">' + esc(help) + '</p>' : '') + '</div>';
  }

  function timelineRowsHTML() {
    if (!draft.timeline.length) return '<p class="empty-tl">No entries yet. Add one entry for each update and each action you take.</p>';
    return '<ol class="tl-list">' + draft.timeline.map((e, i) =>
      '<li class="tl-row"><div class="tl-time"><input type="text" class="dt" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="9" placeholder="HH:MM" id="tl-t-' + i + '" data-tl="t" data-i="' + i + '" value="' + esc(e.t) + '" aria-label="Time of entry ' + (i + 1) + ', HH:MM"><button type="button" class="btn btn-sm btn-ghost" data-action="now-entry" data-i="' + i + '" title="Current time">Now</button></div>' +
      '<textarea id="tl-a-' + i + '" data-tl="a" data-i="' + i + '" rows="2" placeholder="What happened, or what you did" aria-label="Entry ' + (i + 1) + ' description">' + esc(e.a) + '</textarea>' +
      '<button type="button" class="icon-btn" data-action="remove-entry" data-i="' + i + '" aria-label="Remove entry ' + (i + 1) + '" title="Remove entry">' + ICON.trash + '</button></li>').join('') + '</ol>';
  }
  function timelineFieldHTML(label) {
    return '<div class="field wide" data-key="timeline"><span class="label">' + esc(label) + ' <span class="req" aria-hidden="true">*</span></span>' +
      '<p class="help" style="margin:0 0 10px">One entry per update or action, in time order. Use 24-hour time (14:05, not 2:05).</p>' +
      '<div id="tl-rows">' + timelineRowsHTML() + '</div><button type="button" class="btn btn-sm" data-action="add-entry">+ Add entry</button></div>';
  }

  function formHTML() {
    const tpl = TEMPLATES[draft.template];
    const groups = GROUPS.map((g) => {
      const keys = tpl.fields.filter((k) => FIELDS[k].group === g[0]);
      if (!keys.length && g[0] !== 'summary') return '';
      let extra = '';
      if (g[0] === 'summary') {
        extra = '<div class="field" data-key="author"><label for="f-author">Documented by <span class="req" aria-hidden="true">*</span></label><input id="f-author" type="text" value="' + esc(draft.author) + '" placeholder="Your name" autocomplete="name" aria-required="true"><p class="help">Every record names the person who wrote it.</p></div>';
        if (draft.mode === 'edit') extra += '<div class="field"><label for="f-change">Reason for this change</label><input id="f-change" type="text" value="' + esc(draft.changeNote) + '" placeholder="e.g. Added root cause after log review"><p class="help">Saved in the revision history.</p></div>';
      }
      return '<div class="form-group"><div class="group-title"><h2>' + esc(g[1]) + '</h2>' + (g[2] ? '<span class="w">' + esc(g[2]) + '</span>' : '') + '</div><div class="fields">' + keys.map(fieldHTML).join('') + extra + '</div></div>';
    }).join('');
    const checkBtn = draft.scenarioId ? '<button type="button" class="btn" data-action="check">Check<span class="hide-sm"> my documentation</span></button>' : '';
    return '<form id="docform" class="stack" novalidate>' + groups +
      '<div class="formbar"><span class="draft-status" id="draft-status">Your draft saves automatically</span><span class="spacer"></span>' +
      '<button type="button" class="btn btn-ghost" data-action="discard">' + (draft.mode === 'edit' ? 'Cancel edit' : 'Discard') + '</button>' + checkBtn +
      '<button type="button" class="btn' + (CLASS_READY ? '' : ' btn-primary') + '" data-action="save">' + (draft.mode === 'edit' ? 'Save<span class="hide-sm"> changes</span>' : 'Save<span class="hide-sm"> record</span>') + '</button>' +
      (CLASS_READY ? '<button type="button" class="btn btn-primary" data-action="submit">Submit<span class="hide-sm"> to class</span></button>' : '') + '</div></form>';
  }

  function scoreHTML(ev) {
    const pct = ev.total ? Math.round(ev.found / ev.total * 100) : 0;
    const tiles = W5H.map((w) => {
      const all = ev.facts.filter((f) => f.w === w);
      if (!all.length) return '<div class="w-tile"><span>' + w + '</span><b class="muted">–</b></div>';
      const got = all.filter((f) => f.ok).length;
      return '<div class="w-tile' + (got === all.length ? ' full' : got === 0 ? ' none' : '') + '"><span>' + w + '</span><b>' + got + '/' + all.length + '</b></div>';
    }).join('');
    return '<div class="score"><div class="score-num">' + ev.found + '<span>/' + ev.total + '</span></div><div class="score-text"><strong>' + verdict(pct) + '</strong><p class="muted">key facts captured (' + pct + '%)</p><div class="meter" role="img" aria-label="' + pct + ' percent"><span style="width:' + pct + '%"></span></div></div></div>' +
      '<div class="w-grid">' + tiles + '</div>';
  }
  function factsHTML(ev) {
    const mark = (lvl) => '<span class="mark">' + (lvl === 'ok' ? ICON.check : lvl === 'bad' ? ICON.x : ICON.warn) + '</span>';
    const facts = ev.facts.map((f) => '<li class="lvl-' + (f.ok ? 'ok' : 'bad') + '">' + mark(f.ok ? 'ok' : 'bad') + '<div><span class="fact-w">' + f.w + '</span>' + esc(f.label) + (!f.ok && f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '') + '</div></li>').join('');
    const checks = ev.checks.map((c) => '<li class="lvl-' + c.lvl + '">' + mark(c.lvl) + '<div>' + esc(c.text) + '</div></li>').join('');
    return '<div class="pane"><h3>Key facts</h3><ul class="checklist">' + facts + '</ul><p class="help" style="margin-top:10px">The check looks for names, numbers, times and keywords anywhere in the record. Use it as a guide, not a grade.</p></div>' +
      '<div class="pane"><h3>Documentation standards</h3><ul class="checklist">' + checks + '</ul></div>';
  }

  function reviewHTML() {
    const ev = state.review;
    const unrevealed = ev.unrevealed > 0 ? '<p class="notice">You haven’t read ' + ev.unrevealed + (ev.unrevealed === 1 ? ' update' : ' updates') + ' yet. Facts in unread updates count as missing.</p>' : '';
    return '<div class="pane"><p class="eyebrow">Documentation check</p>' + scoreHTML(ev) + unrevealed +
      '<p class="help" style="margin-top:16px">The example answer opens after you ' + (CLASS_READY ? 'save or submit' : 'save') + ' your record.</p></div>' +
      factsHTML(ev) +
      '<div class="formbar"><button type="button" class="btn" data-action="back">← Back<span class="hide-sm"> to editing</span></button><span class="spacer"></span>' +
      '<button type="button" class="btn' + (CLASS_READY ? '' : ' btn-primary') + '" data-action="save">Save<span class="hide-sm"> record</span></button>' +
      (CLASS_READY ? '<button type="button" class="btn btn-primary" data-action="submit">Submit<span class="hide-sm"> to class</span></button>' : '') + '</div>';
  }

  /* Document (record view, example answer) */
  function docHTML(rec, opts) {
    opts = opts || {};
    const tpl = TEMPLATES[rec.template];
    const f = rec.fields || {};
    const L = (k) => labelFor(rec.template, k);
    const val = (v) => v ? '<dd>' + nl(v) + '</dd>' : '<dd class="not-recorded">Not recorded</dd>';
    const meta = [
      ['Record ID', '<span class="mono">' + esc(rec.id) + '</span>'],
      ['Status', stChip(f.status) || '<span class="not-recorded">Not set</span>']
    ];
    if (tpl.fields.includes('severity')) meta.push(['Severity', sevChip(f.severity) || '<span class="not-recorded">Not set</span>']);
    meta.push([L('occurred'), '<span class="mono">' + (esc(fmtDT(f.occurred)) || '—') + '</span>']);
    if (tpl.fields.includes('resolved')) meta.push([L('resolved'), '<span class="mono">' + (esc(fmtDT(f.resolved)) || '—') + '</span>']);
    meta.push(['Documented by', esc(rec.author || '—')]);
    if (!opts.example) {
      meta.push(['Created', '<span class="mono">' + esc(fmtStamp(rec.createdAt)) + '</span>']);
      meta.push(['Last updated', '<span class="mono">' + esc(fmtStamp(rec.updatedAt)) + '</span>']);
      meta.push(['Version', '<span class="mono">' + esc(rec.version || 1) + '</span>']);
    }
    const skip = ['title', 'status', 'severity', 'occurred', 'resolved'];
    const sections = GROUPS.filter((g) => g[0] !== 'summary').map((g) => {
      const keys = tpl.fields.filter((k) => FIELDS[k].group === g[0] && skip.indexOf(k) === -1);
      if (!keys.length) return '';
      const body = keys.map((k) => {
        if (k === 'timeline') {
          const tl = (rec.timeline || []).filter((e) => e.t || e.a);
          return tl.length ? '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Action / event</th></tr></thead><tbody>' + tl.map((e) => '<tr><td class="t">' + (esc(e.t) || '—') + '</td><td>' + nl(e.a) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="not-recorded">No timeline entries</p>';
        }
        return '<dl class="kv"><dt>' + esc(L(k)) + '</dt>' + val(f[k]) + '</dl>';
      }).join('');
      return '<section class="doc-section"><h3>' + esc(g[1]) + '</h3>' + body + '</section>';
    }).join('');
    const revs = !opts.example && rec.revisions && rec.revisions.length
      ? '<section class="doc-section"><h3>Revision history</h3><div class="table-wrap"><table><thead><tr><th>Version</th><th>Date &amp; time</th><th>By</th><th>Change</th></tr></thead><tbody>' +
        rec.revisions.map((r) => '<tr><td class="mono">' + esc(r.v) + '</td><td class="mono nowrap">' + esc(fmtStamp(r.at)) + '</td><td>' + esc(r.by) + '</td><td>' + esc(r.note) + '</td></tr>').join('') + '</tbody></table></div></section>'
      : '';
    return '<article class="doc"><header class="doc-head"><p class="eyebrow">' + esc(tpl.label) + (rec.example ? ' · <span class="chip chip-example">Example</span>' : '') + '</p><h2>' + (f.title ? esc(f.title) : '<span class="not-recorded">Untitled</span>') + '</h2>' +
      '<dl class="doc-meta">' + meta.map((m) => '<div><dt>' + esc(m[0]) + '</dt><dd>' + m[1] + '</dd></div>').join('') + '</dl></header>' + sections + revs + '</article>';
  }

  function toMarkdown(rec) {
    const tpl = TEMPLATES[rec.template];
    const f = rec.fields || {};
    const L = (k) => labelFor(rec.template, k);
    const lines = ['# ' + rec.id + ': ' + (f.title || 'Untitled'), '', '**' + tpl.label + '**', '', '| Field | Value |', '|---|---|'];
    const row = (k, v) => lines.push('| ' + k + ' | ' + String(v || '—').replace(/\|/g, '\\|').replace(/\n/g, ' ') + ' |');
    row('Record ID', rec.id); row('Status', f.status);
    if (tpl.fields.includes('severity')) row('Severity', f.severity);
    row(L('occurred'), fmtDT(f.occurred));
    if (tpl.fields.includes('resolved')) row(L('resolved'), fmtDT(f.resolved));
    row('Documented by', rec.author); row('Created', fmtStamp(rec.createdAt)); row('Last updated', fmtStamp(rec.updatedAt)); row('Version', rec.version);
    const skip = ['title', 'status', 'severity', 'occurred', 'resolved'];
    GROUPS.filter((g) => g[0] !== 'summary').forEach((g) => {
      const keys = tpl.fields.filter((k) => FIELDS[k].group === g[0] && skip.indexOf(k) === -1);
      if (!keys.length) return;
      lines.push('', '## ' + g[1], '');
      keys.forEach((k) => {
        if (k === 'timeline') {
          lines.push('| Time | Action / event |', '|---|---|');
          (rec.timeline || []).filter((e) => e.t || e.a).forEach((e) => lines.push('| ' + (e.t || '—') + ' | ' + String(e.a || '').replace(/\|/g, '\\|').replace(/\n/g, ' ') + ' |'));
        } else {
          lines.push('**' + L(k) + ':** ' + (f[k] || '_Not recorded_'), '');
        }
      });
    });
    if (rec.revisions && rec.revisions.length) {
      lines.push('', '## Revision history', '', '| Version | Date & time | By | Change |', '|---|---|---|---|');
      rec.revisions.forEach((r) => lines.push('| ' + r.v + ' | ' + fmtStamp(r.at) + ' | ' + (r.by || '') + ' | ' + (r.note || '') + ' |'));
    }
    return lines.join('\n') + '\n';
  }

  /* Records */
  function storeModeHTML() {
    if (!store.ready) return '<span class="store-mode local"><i></i>Loading…</span>';
    return store.mode === 'cloud'
      ? '<span class="store-mode" title="Only you can see these records"><i></i>Saved to your Claude account</span>'
      : '<span class="store-mode local" title="Records are kept in this browser on this device"><i></i>Saved in this browser only</span>';
  }
  function renderStoreMode() { const el = $('#store-mode'); if (el) el.innerHTML = storeModeHTML(); }
  function filteredRecords() {
    const q = state.filters.q.trim().toLowerCase();
    return store.records.filter((r) => {
      if (state.filters.type && r.template !== state.filters.type) return false;
      if (state.filters.status && (r.fields || {}).status !== state.filters.status) return false;
      if (!q) return true;
      return (r.id + ' ' + (r.author || '') + ' ' + recordText(r)).toLowerCase().indexOf(q) !== -1;
    }).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  }
  function recordRows() {
    if (!store.ready) return '<div class="empty"><p>Loading your records…</p></div>';
    if (!store.records.length) {
      return '<div class="empty"><h2>No records yet</h2><p>Records appear here after you save them. Work through a scenario to create your first one, or add an example record to see what a finished record looks like.</p>' +
        '<div class="btn-row"><a class="btn btn-primary" href="#scenarios">Choose a scenario</a><button class="btn" data-action="add-example">Add an example record</button></div></div>';
    }
    const list = filteredRecords();
    if (!list.length) return '<div class="empty"><p>No records match your search.</p></div>';
    return '<div class="table-wrap"><table class="records"><thead><tr><th>Record ID</th><th>Title</th><th>Type</th><th>Severity</th><th>Status</th><th>Occurred</th><th>Documented by</th><th>Check</th></tr></thead><tbody>' +
      list.map((r) => {
        const f = r.fields || {};
        return '<tr data-open="' + esc(r.id) + '"><td class="mono nowrap">' + esc(r.id) + '</td><td><a href="#record-' + encodeURIComponent(r.id) + '">' + esc(f.title || 'Untitled') + '</a>' + (r.example ? ' <span class="chip chip-example">Example</span>' : '') + (r.submittedAt ? ' <span class="chip chip-sent">Submitted</span>' : '') + '</td>' +
          '<td class="nowrap">' + esc(TEMPLATES[r.template].label) + '</td><td>' + sevChip(f.severity) + '</td><td>' + stChip(f.status) + '</td>' +
          '<td class="mono nowrap">' + esc(fmtDT(f.occurred)) + '</td><td>' + esc(r.author || '') + '</td>' +
          '<td class="mono nowrap">' + (r.check ? r.check.found + '/' + r.check.total : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  function recordsView() {
    const types = Object.keys(TEMPLATES).map((k) => '<option value="' + k + '"' + (state.filters.type === k ? ' selected' : '') + '>' + esc(TEMPLATES[k].label) + '</option>').join('');
    const statuses = FIELDS.status.options.map((o) => '<option' + (state.filters.status === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
    const blanks = Object.keys(TEMPLATES).map((k) => '<button class="btn btn-sm" data-action="blank" data-template="' + k + '">' + esc(TEMPLATES[k].label) + '</button>').join('');
    return '<div class="page-head"><div><p class="eyebrow">Records</p><h1>Documentation log</h1><p class="lead">Every record you save, newest first. Open one to read it, edit it (each edit is kept in its revision history), or export it.</p></div><span class="spacer"></span>' +
      '<button class="btn" data-action="export-all"' + (store.records.length ? '' : ' disabled') + '>Download all (JSON)</button>' +
      '<button class="btn btn-ghost" data-action="reset-all"' + (store.records.length || draft ? '' : ' disabled') + '>Reset all</button></div>' +
      (state.confirmReset ? '<div class="banner" role="alert" style="margin:0 0 22px"><p>Delete ' + [store.records.length ? (store.records.length === 1 ? '1 record' : 'all ' + store.records.length + ' records') : '', draft ? 'your unsaved draft' : ''].filter(Boolean).join(' and ') + ' from this ' + (store.mode === 'cloud' ? 'account' : 'browser') + '? This can’t be undone.' + (store.records.length ? ' Download them first if you want a copy.' : '') + '</p>' +
        '<div class="btn-row"><button class="btn btn-danger btn-sm" data-action="confirm-reset">Delete everything</button><button class="btn btn-sm" data-action="cancel-reset">Cancel</button></div></div>' : '') +
      '<div class="toolbar"><input type="search" id="rec-q" placeholder="Search by ID, title, person, system…" value="' + esc(state.filters.q) + '" aria-label="Search records">' +
      '<select id="rec-type" aria-label="Filter by type"><option value="">All types</option>' + types + '</select>' +
      '<select id="rec-status" aria-label="Filter by status"><option value="">All statuses</option>' + statuses + '</select>' +
      '<span id="store-mode">' + storeModeHTML() + '</span></div>' +
      '<div id="rec-rows">' + recordRows() + '</div>' +
      '<div class="new-row"><span>New blank record:</span>' + blanks + '</div>';
  }

  function recordView() {
    if (!store.ready) return '<div class="empty"><p>Loading record…</p></div>';
    const rec = store.records.find((r) => r.id === state.recordId);
    if (!rec) return '<div class="empty"><h2>Record not found</h2><p>It may have been deleted.</p><div class="btn-row"><a class="btn" href="#records">Back to records</a></div></div>';
    const sc = scenarioById(rec.scenarioId);
    const del = state.confirmDelete
      ? '<span class="muted">Delete ' + esc(rec.id) + ' permanently?</span><button class="btn btn-danger btn-sm" data-action="confirm-delete">Delete</button><button class="btn btn-ghost btn-sm" data-action="cancel-delete">Keep</button>'
      : '<button class="btn btn-ghost btn-sm" data-action="delete">' + ICON.trash + 'Delete</button>';
    const sent = rec.submittedAt ? '<span class="chip chip-sent">Submitted to class · ' + esc(fmtStamp(rec.submittedAt)) + '</span>' : '';
    const check = rec.check || sent ? '<div class="pane check-summary">' + (rec.check ? '<span class="eyebrow">Documentation check</span><strong class="mono">' + rec.check.found + '/' + rec.check.total + ' key facts</strong><span class="muted">' + (sc ? 'Scenario: ' + esc(sc.title) : '') + '</span>' : '') + '<span class="spacer"></span>' + sent + '</div>' : '';
    const submit = CLASS_READY ? '<button class="btn btn-primary btn-sm" data-action="submit-record">' + (rec.submittedAt ? 'Submit again' : 'Submit to class') + '</button>' : '';
    const example = sc ? '<div class="record-bar" style="margin-top:26px"><button class="btn" data-action="toggle-example">' + (state.showExample ? 'Hide example answer' : 'Compare with example answer') + '</button></div>' +
      (state.showExample ? docHTML(modelRecord(sc, rec.scenarioDate), { example: true }) : '') : '';
    return '<div class="record-bar"><a class="btn btn-ghost btn-sm" href="#records">← All records</a><span class="spacer"></span>' + submit +
      '<button class="btn btn-sm" data-action="edit">Edit</button><button class="btn btn-sm" data-action="copy-md">Copy as Markdown</button><button class="btn btn-sm" data-action="download-md">Download .md</button>' + del + '</div>' +
      check + docHTML(rec) + example +
      '<details class="md"><summary>Markdown version</summary><pre id="md-text">' + esc(toMarkdown(rec)) + '</pre></details>';
  }

  /* Class review */
  const clsItem = (id) => (state.cls.items || []).find((it) => it.id === id);
  function classScore(it) {
    if (it._ev === undefined) it._ev = scenarioById(it.record.scenarioId) ? evaluate(asDraft(it.record)) : null;
    return it._ev;
  }
  function classOrder() {
    const c = state.cls;
    const pct = (it) => { const ev = classScore(it); return ev && ev.total ? ev.found / ev.total : -1; };
    return (c.items || [])
      .filter((it) => !c.scenario || it.record.scenarioId === c.scenario)
      .sort((a, b) => c.sort === 'score' ? pct(b) - pct(a) : c.sort === 'name' ? String(a.name).localeCompare(String(b.name)) : String(b.created_at).localeCompare(String(a.created_at)))
      .map((it) => it.id);
  }
  function classLink() {
    if (!/^https?:$/.test(location.protocol)) return '';
    const share = state.cls.share;
    return location.origin + location.pathname + (share === 'random' ? '#start-random' : share ? '#start-' + share : '#class');
  }
  function classStatus() {
    const c = state.cls;
    const n = c.items ? c.items.length : 0;
    return n + (n === 1 ? ' submission' : ' submissions') + (c.updated ? ' · updated ' + c.updated.toTimeString().slice(0, 8) : '');
  }

  function classView() {
    const head = '<div class="page-head"><div><p class="eyebrow">Class review</p><h1>Class submissions</h1><p class="lead">Classmates work through a scenario and click <strong>Submit to class</strong>. Review their records here, one at a time, on the projector.</p></div></div>';
    if (IN_ARTIFACT) return head + '<div class="pane"><h2>Open the class website to use this</h2><p class="muted" style="margin-top:8px">Class submissions work on the public website (Vercel or GitHub Pages), not on this Claude link.</p></div>';
    if (!CLASS_READY) return head + '<div class="pane"><h2>Not connected yet</h2><p class="muted" style="margin-top:8px">Class submissions need the Supabase database. After it is set up with <span class="mono">supabase/schema.sql</span>, its project URL and public key go into <span class="mono">SUPABASE_URL</span> and <span class="mono">SUPABASE_KEY</span> at the top of the script in <span class="mono">index.html</span>.</p></div>';
    if (state.cls.openId && clsItem(state.cls.openId)) return classDetailView();
    return head + shareHTML() + classListHTML();
  }

  function shareHTML() {
    const link = classLink();
    const opts = '<option value="">Let them choose a class scenario</option>' +
      '<option value="random"' + (state.cls.share === 'random' ? ' selected' : '') + '>Give each person a random class scenario</option>' + scenarioOptions(state.cls.share);
    return '<div class="pane share">' + (link ? '<div class="qr" id="qr" role="img" aria-label="QR code for the class link"></div>' : '') +
      '<div style="min-width:0"><h2>Invite classmates</h2>' +
      '<label for="share-scenario" style="margin-top:14px">What the link opens</label><select id="share-scenario">' + opts + '</select>' +
      (link ? '<div class="link-row"><code id="class-link">' + esc(link) + '</code><button class="btn btn-sm" data-action="copy-link">Copy link</button></div>'
        : '<p class="notice">Open this page from its web address (Vercel or GitHub Pages) to get a link and QR code for classmates.</p>') +
      '<ol class="rules"><li>Scan the QR code or open the link.</li><li>Work through the scenario and write the record.</li><li>Type your name in <strong>Documented by</strong>, then click <strong>Submit to class</strong>.</li></ol></div></div>';
  }

  function classRowsHTML() {
    const c = state.cls;
    if (!c.items.length) return '<div class="empty"><h2>No submissions yet</h2><p>Share the link or QR code above. Submissions appear here as classmates send them.</p></div>';
    const order = classOrder();
    if (!order.length) return '<div class="empty"><p>No submissions for this scenario yet.</p></div>';
    return '<div class="table-wrap"><table class="records"><thead><tr><th>#</th><th>Name</th><th>Scenario</th><th>Key facts</th><th>Checks used</th><th>Submitted</th></tr></thead><tbody>' +
      order.map((id, n) => {
        const it = clsItem(id);
        const ev = classScore(it);
        const pct = ev && ev.total ? Math.round(ev.found / ev.total * 100) : 0;
        return '<tr data-sub="' + esc(id) + '"><td class="mono">' + (n + 1) + '</td><td><a href="#review" data-action="class-open" data-id="' + esc(id) + '">' + esc(it.name || 'Unnamed') + '</a></td>' +
          '<td>' + esc(it.scenario_title || '') + '</td><td class="mono nowrap">' + (ev ? ev.found + '/' + ev.total + '<span class="mini-meter"><span style="width:' + pct + '%"></span></span>' : '—') + '</td>' +
          '<td class="mono">' + (Number(it.checks_used) || 0) + '</td><td class="mono nowrap">' + esc(fmtStamp(it.created_at)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function classListHTML() {
    const c = state.cls;
    if (!c.items) {
      return '<div class="pane"><h2>Review submissions</h2><p class="muted" style="margin-top:6px">Enter your review code. Classmates don’t need it, and they can’t see each other’s work.</p>' +
        '<form class="code-form" data-form="class-code"><input type="password" id="rv-code" value="' + esc(LS.get(KEY_REVIEW_CODE) || '') + '" placeholder="Review code" autocomplete="current-password" aria-label="Review code">' +
        '<button class="btn btn-primary" type="submit"' + (c.loading ? ' disabled' : '') + '>' + (c.loading ? 'Loading…' : 'Load submissions') + '</button></form>' +
        (c.error ? '<p class="notice">' + esc(c.error) + '</p>' : '') + '</div>';
    }
    const opts = '<option value="">All scenarios</option>' + scenarioOptions(c.scenario);
    const sorts = [['newest', 'Newest first'], ['score', 'Highest score'], ['name', 'Name A–Z']].map((o) => '<option value="' + o[0] + '"' + (c.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('');
    const clear = c.confirmClear
      ? '<span class="muted">Delete all ' + c.items.length + ' submissions?</span><button class="btn btn-danger btn-sm" data-action="class-clear-confirm">Delete all</button><button class="btn btn-sm" data-action="class-clear-cancel">Cancel</button>'
      : '<button class="btn btn-ghost btn-sm" data-action="class-clear"' + (c.items.length ? '' : ' disabled') + '>Delete all</button>';
    return '<div class="pane"><div class="sub-head"><div><h2>Submissions</h2><p class="muted" id="class-status" style="margin-top:4px">' + esc(classStatus()) + '</p></div><span class="spacer"></span>' +
      '<label class="toggle"><input type="checkbox" id="class-auto"' + (c.auto ? ' checked' : '') + '>Auto-refresh</label>' +
      '<button class="btn btn-sm" data-action="class-refresh"' + (c.loading ? ' disabled' : '') + '>Refresh</button>' + clear + '</div>' +
      '<div class="toolbar" style="margin:18px 0 16px"><select id="class-scenario" aria-label="Filter by scenario">' + opts + '</select><select id="class-sort" aria-label="Sort submissions">' + sorts + '</select>' +
