  let qrLib = null;
  function loadQR() {
    if (!qrLib) {
      qrLib = new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        el.onload = () => (window.QRCode ? resolve(window.QRCode) : reject(new Error('QR library missing')));
        el.onerror = () => { qrLib = null; reject(new Error('QR library failed to load')); };
        document.head.appendChild(el);
      });
    }
    return qrLib;
  }
  async function drawQR() {
    const box = $('#qr');
    const link = classLink();
    if (!box || !link) return;
    try {
      const QR = await loadQR();
      if (!box.isConnected) return;
      box.innerHTML = '';
      new QR(box, { text: link, width: 168, height: 168, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QR.CorrectLevel.M });
    } catch (e) { box.hidden = true; }
  }

  let classTimer = null;
  function syncAuto() {
    const c = state.cls;
    const on = state.view === 'review' && c.auto && !!c.items && !c.openId;
    if (on && !classTimer) classTimer = setInterval(() => classLoad(true), 15000);
    if (!on && classTimer) { clearInterval(classTimer); classTimer = null; }
  }
  function renderClassRows() {
    const rows = $('#class-rows'); if (rows) rows.innerHTML = classRowsHTML();
    const st = $('#class-status'); if (st) st.textContent = classStatus();
  }

  async function classLoad(silent) {
    const c = state.cls;
    const input = $('#rv-code');
    if (input) LS.set(KEY_REVIEW_CODE, input.value.trim());
    const code = LS.get(KEY_REVIEW_CODE) || '';
    if (!code) { c.error = 'Enter your review code.'; render(); return; }
    if (c.loading) return;
    c.loading = true;
    if (!silent) { c.error = ''; if (!c.items) render(); else { const b = $('[data-action="class-refresh"]'); if (b) b.disabled = true; } }
    let wrong = false;
    try {
      const rows = await classApi.list(code);
      c.items = (Array.isArray(rows) ? rows : []).filter((it) => it && it.id && it.record && TEMPLATES[it.record.template]);
      c.updated = new Date();
      c.error = '';
    } catch (e) {
      wrong = /review code/i.test(e.message);
      if (wrong) { c.items = null; c.auto = false; c.openId = null; LS.del(KEY_REVIEW_CODE); }
      c.error = wrong ? 'That review code is not correct.'
        : notSetUp(e) ? 'The class database isn’t set up yet. Run supabase/schema.sql in the Supabase SQL Editor, then try again.'
        : 'Could not load submissions (' + e.message + '). Check your internet connection and try again.';
    }
    c.loading = false;
    if (state.view !== 'review') return;
    if (c.openId) { if (!clsItem(c.openId)) { c.openId = null; render(); } return; }
    if (!silent || wrong || !$('#class-rows')) { render(); return; }
    renderClassRows();
    const b = $('[data-action="class-refresh"]'); if (b) b.disabled = false;
  }

  function classOpen(id) {
    const c = state.cls;
    c.order = classOrder();
    c.openId = id; c.confirmDel = false;
    state.showExample = false;
    render();
    window.scrollTo(0, 0);
  }

  function submitError(e) {
    if (notSetUp(e)) return 'Class submissions aren’t set up yet. Your record is still here; tell your presenter.';
    return 'Could not submit' + (e && e.status ? ' (' + e.message + ')' : '. Check your internet connection') + '. Your work is still here; try again.';
  }
  async function submitRecord(rec) {
    const sc = scenarioById(rec.scenarioId);
    const ev = sc ? evaluate(asDraft(rec)) : null;
    const id = uuid();
    const record = clone(rec);
    delete record.submittedAt; delete record.submissionId;
    await classApi.submit({
      id, name: String(rec.author || '').trim().slice(0, 80) || 'Unnamed', scenario_id: rec.scenarioId || null,
      scenario_title: sc ? sc.title : TEMPLATES[rec.template].label + ' (blank record)', template: rec.template,
      found: ev ? ev.found : null, total: ev ? ev.total : null, checks_used: Number(rec.checksUsed) || 0, record
    });
    return id;
  }

  /* Guide */
  function guideView() {
    const w = [
      ['Who', 'Who reported it, who is affected (and how many), who did each action, who was told.', 'Maria Santos (Accounting, local 2231); 3 users affected'],
      ['What', 'The system or asset, the symptoms, the exact error message, the impact.', 'FS01, S: drive; “Windows cannot access \\\\FS01\\Accounting”'],
      ['When', 'The date, and the time of every event and action. 24-hour time, full date, time zone.', '2026-10-28 09:42 PHT'],
      ['Where', 'Department, floor, building, room; hostname, IP address or asset tag.', 'Accounting, 2nd floor; server room, Main Building'],
      ['Why', 'The cause (or “unknown, under investigation”), and why it matters to the business.', 'Server service crashed (Event ID 7034); payroll due 12:00'],
      ['How', 'What you did to investigate and fix it, how you confirmed the fix, and what follows.', 'Restarted service 09:58; user confirmed 10:03']
    ];
    const tpls = Object.keys(TEMPLATES).map((k) => '<tr><td>' + esc(TEMPLATES[k].label) + '</td><td class="mono">' + TEMPLATES[k].prefix + '-' + new Date().getFullYear() + '-0001</td><td>' + esc(TEMPLATES[k].use) + '</td></tr>').join('');
    return '<div class="guide"><div class="page-head"><div><p class="eyebrow">How to document</p><h1>Write it so anyone can understand it later</h1><p class="lead">Good documentation lets a colleague, a manager or an auditor understand exactly what happened without asking you. Cover the six questions below for every event.</p></div></div>' +
      '<div class="pane"><h2>The six questions: 5W1H</h2><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Question</th><th>What to record</th><th>Example</th></tr></thead><tbody>' +
      w.map((r) => '<tr><td>' + r[0] + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>').join('') + '</tbody></table></div></div>' +
      '<div class="pane"><h2>Rules for good documentation</h2><ol class="rules">' +
      '<li><strong>Record the date and time of everything.</strong> Use the full date (YYYY-MM-DD) and 24-hour time.</li>' +
      '<li><strong>Write it as it happens.</strong> Notes written hours later miss details and get times wrong.</li>' +
      '<li><strong>Copy error messages word for word.</strong> “It had an error” helps nobody.</li>' +
      '<li><strong>Stick to facts.</strong> Write what you saw and did, not guesses. Mark guesses clearly as unconfirmed.</li>' +
      '<li><strong>Don’t blame people.</strong> Describe what happened, not whose fault it was.</li>' +
      '<li><strong>Record who was notified, and when.</strong> Personal data involved? The DPO must know (Data Privacy Act, 72-hour rule).</li>' +
      '<li><strong>Never write down passwords.</strong> Say how credentials were delivered, never what they are.</li>' +
      '<li><strong>Keep the status current</strong>, and list follow-up actions so nothing is forgotten.</li>' +
      '<li><strong>Don’t rewrite history.</strong> Edits are kept as revisions with a reason, so the original stays traceable.</li></ol></div>' +
      '<div class="pane"><h2>Poor entry vs. good entry</h2><div class="compare"><div class="bad-ex"><h3>Poor</h3><p>“Fixed the shared drive this morning. It was a server problem.”</p></div>' +
      '<div class="good-ex"><h3>Good</h3><p class="mono" style="font-size:13.5px">09:58 Started the Server service (LanmanServer) on FS01 after it stopped at 09:31 (Event ID 7034). Set recovery to restart on failure. 10:03 Maria Santos confirmed access restored.</p></div></div></div>' +
      '<div class="pane"><h2>Which template to use</h2><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Template</th><th>ID format</th><th>Use it when</th></tr></thead><tbody>' + tpls + '</tbody></table></div></div>' +
      '<div class="pane"><h2>How the documentation check works</h2><p style="margin-top:8px">Each scenario has a list of key facts: names, times, numbers, systems and actions a good record should contain. The check searches your whole record for them and also tests documentation standards, such as required fields, a complete timeline in time order, and no passwords. It is a guide to what you may have missed, not a grade.</p></div></div>';
  }

  /* ------------------------------------------------------------- interactions */
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  async function offerDownload(filename, text) {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) {
        try { await dl.save({ filename, data: text }); toast('Saved ' + filename); } catch (e) { if (!e || e.code !== 'declined') toast('Download is not available here. Use Copy as Markdown instead.'); }
        return;
      }
      toast('Download is not available here. Use Copy as Markdown instead.');
      return;
    }
    const blob = new Blob([text], { type: filename.endsWith('.json') ? 'application/json' : 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Downloaded ' + filename);
  }

  // First click arms the button; a second click within 4 seconds confirms.
  function arm(btn, text, safe) {
    btn.dataset.armed = '1';
    btn.dataset.label = btn.innerHTML;
    btn.textContent = text;
    if (!safe) btn.classList.add('btn-danger');
    setTimeout(() => {
      if (btn.isConnected && btn.dataset.armed) { delete btn.dataset.armed; btn.innerHTML = btn.dataset.label; btn.classList.remove('btn-danger'); }
    }, 4000);
  }

  function startDraft(opts) {
    draft = newDraft(opts);
    persistDraft();
    state.review = null; state.showExample = false; state.pendingStart = null;
    go('practice');
  }

  function go(hash) {
    if (location.hash === '#' + hash) route(); else location.hash = hash;
  }

  function markInvalid() {
    const missingKeys = TEMPLATES[draft.template].fields.filter((k) => FIELDS[k].req && !has(draft, k));
    if (!String(draft.author || '').trim()) missingKeys.unshift('author');
    $$('.field.invalid').forEach((el) => el.classList.remove('invalid'));
    missingKeys.forEach((k) => { const el = $('.field[data-key="' + k + '"]'); if (el) el.classList.add('invalid'); });
    const first = missingKeys.length && $('.field[data-key="' + missingKeys[0] + '"]');
    if (first) { first.scrollIntoView({ block: 'center', behavior: 'smooth' }); const input = $('input, select, textarea', first); if (input) input.focus({ preventScroll: true }); }
  }

  // Builds the record from the draft, or highlights the missing required fields and returns null.
  function buildRecord() {
    const missing = requiredMissing(draft);
    if (missing.length) {
      if (state.review) { state.review = null; render(); }
      toast('Fill in the required fields first: ' + missing.join(', ') + '.');
      markInvalid();
      return null;
    }
    const sc = scenarioById(draft.scenarioId);
    const now = new Date().toISOString();
    const by = draft.author.trim();
    const timeline = draft.timeline.filter((e) => (e.t || '').trim() || (e.a || '').trim()).map((e) => ({ t: e.t || '', a: (e.a || '').trim() }));
    const fields = {};
    Object.keys(draft.fields).forEach((k) => { const v = String(draft.fields[k] || '').trim(); if (v) fields[k] = v; });
    const ev = sc ? evaluate(draft) : null;
    let rec;
    if (draft.mode === 'edit') {
      const old = store.records.find((r) => r.id === draft.editingId);
      if (!old) { toast('This record no longer exists.'); return null; }
      rec = clone(old);
      rec.fields = fields; rec.timeline = timeline; rec.updatedAt = now;
      rec.version = (old.version || 1) + 1;
      rec.revisions = (old.revisions || []).concat([{ v: rec.version, at: now, by, note: String(draft.changeNote || '').trim() || 'Updated' }]);
      rec.checksUsed = (Number(old.checksUsed) || 0) + (draft.checks || 0);
      if (ev) rec.check = { found: ev.found, total: ev.total, at: now };
    } else {
      rec = {
        id: nextId(TEMPLATES[draft.template].prefix), template: draft.template, scenarioId: draft.scenarioId, scenarioDate: draft.scenarioDate,
        fields, timeline, author: by, createdAt: now, updatedAt: now, version: 1, checksUsed: draft.checks || 0,
        revisions: [{ v: 1, at: now, by, note: sc ? 'Created from the scenario “' + sc.title + '”' : 'Created' }],
        check: ev ? { found: ev.found, total: ev.total, at: now } : null
      };
    }
    return rec;
  }

  async function saveRecord(btn) {
    const rec = buildRecord();
    if (!rec) return;
    if (btn) btn.disabled = true;
    try { await store.save(rec); } catch (e) { if (btn) btn.disabled = false; return; }
    clearDraft();
    state.review = null;
    toast('Saved ' + rec.id);
    go('record-' + rec.id);
  }

  async function submitDraft(btn) {
    if (requiredMissing(draft).length) { buildRecord(); return; }
    if (!btn.dataset.armed) { arm(btn, 'Click again to submit', true); return; }
    const rec = buildRecord();
    if (!rec) return;
    delete btn.dataset.armed;
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    try {
      rec.submissionId = await submitRecord(rec);
      rec.submittedAt = new Date().toISOString();
    } catch (e) {
      btn.disabled = false;
      btn.innerHTML = btn.dataset.label || 'Submit to class';
      toast(submitError(e));
      return;
    }
    try { await store.save(rec); } catch (e) { /* the submission already went through */ }
    clearDraft();
    state.review = null;
    toast('Submitted to class');
    go('record-' + rec.id);
  }

  function route() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    state.confirmDelete = false;
    state.confirmReset = false;
    state.cls.confirmClear = false; state.cls.confirmDel = false;
    if (h === 'records') state.view = 'records';
    else if (h === 'guide') state.view = 'guide';
    else if (h === 'review') state.view = 'review';
    else if (h === 'class') state.view = 'class';
    else if (h === 'start-random' || (h.indexOf('start-') === 0 && scenarioById(h.slice(6)))) {
      // Class link: open the scenario straight away (or ask before replacing unsaved work).
      // start-random gives each person a random class scenario, so neighbours get different ones.
      const keep = draft && draft.mode !== 'edit' && CLASS_SET.some((x) => x.id === draft.scenarioId) ? draft.scenarioId : null;
      const id = h === 'start-random' ? (keep || CLASS_SET[Math.floor(Math.random() * CLASS_SET.length)].id) : h.slice(6);
      if (draft && draft.scenarioId === id && draft.mode !== 'edit') state.view = 'practice';
      else if (draft) { state.pendingStart = { mode: 'scenario', scenarioId: id }; state.view = 'scenarios'; }
      else { draft = newDraft({ mode: 'scenario', scenarioId: id }); persistDraft(); state.view = 'practice'; }
      history.replaceState(null, '', state.view === 'practice' ? '#practice' : '#scenarios');
    }
    else if (h === 'practice' && draft) state.view = 'practice';
    else if (h.indexOf('record-') === 0) { state.view = 'record'; state.recordId = h.slice(7); }
    else state.view = 'scenarios';
    if (state.view !== 'practice') { state.review = null; state.showExample = false; }
    if (state.view !== 'review') state.cls.openId = null;
    render();
    window.scrollTo(0, 0);
  }

  app.addEventListener('click', async (e) => {
    const row = e.target.closest('tr[data-open]');
    if (row && !e.target.closest('a')) { go('record-' + row.dataset.open); return; }
    const subRow = e.target.closest('tr[data-sub]');
    if (subRow) { e.preventDefault(); classOpen(subRow.dataset.sub); return; }
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const act = btn.dataset.action;
    const sc = draft ? scenarioById(draft.scenarioId) : null;

    if (act === 'start' || act === 'blank') {
      const opts = act === 'start' ? { mode: 'scenario', scenarioId: btn.dataset.id } : { mode: 'blank', template: btn.dataset.template };
      if (draft) { state.pendingStart = opts; if (state.view !== 'scenarios') go('scenarios'); else render(); window.scrollTo(0, 0); return; }
      startDraft(opts);
    } else if (act === 'confirm-start') { const opts = state.pendingStart; clearDraft(); startDraft(opts); }
    else if (act === 'cancel-start') { state.pendingStart = null; render(); }
    else if (act === 'resume') { state.pendingStart = null; go('practice'); }
    else if (act === 'reveal' || act === 'reveal-all') {
      draft.revealed = act === 'reveal' ? Math.min(sc.events.length, draft.revealed + 1) : sc.events.length;
      persistDraft();
      const pane = $('#feed-pane');
      pane.innerHTML = feedHTML(sc, act === 'reveal');
      const fresh = $('.event.fresh', pane) || $$('.event', pane).pop();
      if (fresh) pane.scrollTop = fresh.offsetTop - pane.offsetTop - 12;
      const next = $('[data-action="reveal"]', pane);
      if (next) next.focus({ preventScroll: true });
    } else if (act === 'now-field') {
      const key = btn.dataset.field;
      draft.fields[key] = nowLocal();
      const input = $('#f-' + key); if (input) input.value = draft.fields[key];
      saveDraftSoon();
    } else if (act === 'now-entry') {
      const i = Number(btn.dataset.i);
      draft.timeline[i].t = hm(new Date());
      const input = $('#tl-t-' + i); if (input) input.value = draft.timeline[i].t;
      saveDraftSoon();
    } else if (act === 'add-entry') {
      draft.timeline.push({ t: draft.scenarioId ? '' : hm(new Date()), a: '' });
      $('#tl-rows').innerHTML = timelineRowsHTML();
      saveDraftSoon();
      const i = draft.timeline.length - 1;
      const input = $(draft.scenarioId ? '#tl-t-' + i : '#tl-a-' + i); if (input) input.focus();
    } else if (act === 'remove-entry') {
      draft.timeline.splice(Number(btn.dataset.i), 1);
      $('#tl-rows').innerHTML = timelineRowsHTML();
      saveDraftSoon();
    } else if (act === 'check') {
      draft.checks = (draft.checks || 0) + 1;
      persistDraft();
      state.review = evaluate(draft);
      $('#form-pane').innerHTML = reviewHTML();
      $('#form-pane').scrollIntoView({ block: 'start', behavior: 'smooth' });
    } else if (act === 'back') {
      state.review = null; state.showExample = false;
      $('#form-pane').innerHTML = formHTML();
    } else if (act === 'toggle-example') {
      state.showExample = !state.showExample;
      render();
    } else if (act === 'save') { saveRecord(btn); }
    else if (act === 'submit') { submitDraft(btn); }
    else if (act === 'submit-record') {
      const rec = store.records.find((r) => r.id === state.recordId);
      if (!rec) return;
      if (!btn.dataset.armed) { arm(btn, 'Click again to submit', true); return; }
      delete btn.dataset.armed;
      btn.disabled = true;
      btn.textContent = 'Submitting…';
      try {
        const upd = clone(rec);
        upd.submissionId = await submitRecord(rec);
        upd.submittedAt = new Date().toISOString();
        await store.save(upd);
        toast('Submitted to class');
        render();
      } catch (err) { btn.disabled = false; btn.innerHTML = btn.dataset.label || 'Submit to class'; toast(submitError(err)); }
    }
    else if (act === 'copy-link') {
      const link = classLink();
      if (link) toast((await copyText(link)) ? 'Link copied' : 'Copy is blocked here. Select the link and copy it.');
    }
    else if (act === 'class-open') { e.preventDefault(); classOpen(btn.dataset.id); }
    else if (act === 'class-back') { state.cls.openId = null; state.showExample = false; render(); window.scrollTo(0, 0); }
    else if (act === 'class-prev' || act === 'class-next') {
      const order = state.cls.order.length ? state.cls.order : classOrder();
      const next = order[order.indexOf(state.cls.openId) + (act === 'class-next' ? 1 : -1)];
      if (next) classOpen(next);
    }
    else if (act === 'class-refresh') { classLoad(false); }
    else if (act === 'class-lock') { LS.del(KEY_REVIEW_CODE); Object.assign(state.cls, { items: null, auto: false, openId: null, error: '', updated: null }); render(); }
    else if (act === 'class-clear') { state.cls.confirmClear = true; render(); }
    else if (act === 'class-clear-cancel') { state.cls.confirmClear = false; render(); }
    else if (act === 'class-clear-confirm') {
      btn.disabled = true;
      try { await classApi.clear(LS.get(KEY_REVIEW_CODE) || ''); state.cls.items = []; state.cls.confirmClear = false; toast('All submissions deleted'); render(); }
      catch (err) { btn.disabled = false; toast('Could not delete the submissions (' + err.message + ').'); }
    }
    else if (act === 'class-del') { state.cls.confirmDel = true; render(); }
    else if (act === 'class-del-cancel') { state.cls.confirmDel = false; render(); }
    else if (act === 'class-del-confirm') {
      const c = state.cls;
      const order = c.order.length ? c.order : classOrder();
      const pos = order.indexOf(c.openId);
      const id = c.openId;
      btn.disabled = true;
      try {
        await classApi.remove(LS.get(KEY_REVIEW_CODE) || '', id);
        c.items = c.items.filter((it) => it.id !== id);
        c.order = order.filter((x) => x !== id);
        c.openId = c.order[Math.min(pos, c.order.length - 1)] || null;
        c.confirmDel = false; state.showExample = false;
        toast('Submission deleted');
        render();
      } catch (err) { btn.disabled = false; toast('Could not delete the submission (' + err.message + ').'); }
    }
    else if (act === 'discard') {
      if (btn.dataset.armed) {
        const editing = draft.mode === 'edit' ? draft.editingId : null;
        clearDraft(); state.review = null;
        toast(editing ? 'Edit cancelled' : 'Draft discarded');
        go(editing ? 'record-' + editing : 'scenarios');
      } else {
        arm(btn, draft.mode === 'edit' ? 'Click again to cancel' : 'Click again to discard');
      }
    } else if (act === 'restart') {
      if (!btn.dataset.armed) { arm(btn, draft.mode === 'edit' ? 'Click again to undo' : 'Click again to start over'); return; }
      if (draft.mode === 'edit') {
        const rec = store.records.find((r) => r.id === draft.editingId);
        if (rec) { draft.fields = clone(rec.fields || {}); draft.timeline = clone(rec.timeline && rec.timeline.length ? rec.timeline : [{ t: '', a: '' }]); draft.changeNote = ''; }
      } else {
        const author = draft.author;
        draft = newDraft({ mode: draft.mode, scenarioId: draft.scenarioId, template: draft.template });
        draft.author = author;
      }
      state.review = null; state.showExample = false;
      persistDraft();
      render();
      window.scrollTo(0, 0);
      toast(draft.mode === 'edit' ? 'Changes undone' : 'Started over');
    } else if (act === 'reset-all') { state.confirmReset = true; render(); }
    else if (act === 'cancel-reset') { state.confirmReset = false; render(); }
    else if (act === 'confirm-reset') {
      btn.disabled = true;
      try {
        const ids = store.records.map((r) => r.id);
        for (const id of ids) await store.remove(id);
        clearDraft();
        LS.del(KEY_AUTHOR);
        state.confirmReset = false;
        state.filters = { q: '', type: '', status: '' };
        changed();
        render();
        toast('Everything was reset');
      } catch (err) { btn.disabled = false; toast('Could not delete every record. Try again.'); }
    } else if (act === 'edit') {
      const rec = store.records.find((r) => r.id === state.recordId);
      if (!rec) return;
      if (draft) { toast('Finish or discard your unsaved draft first.'); state.pendingStart = null; go('scenarios'); return; }
      const rsc = scenarioById(rec.scenarioId);
      draft = {
        mode: 'edit', editingId: rec.id, template: rec.template, scenarioId: rec.scenarioId || null, scenarioDate: rec.scenarioDate || null,
        revealed: rsc ? rsc.events.length : 0, fields: clone(rec.fields || {}), timeline: clone(rec.timeline && rec.timeline.length ? rec.timeline : [{ t: '', a: '' }]),
        author: LS.get(KEY_AUTHOR) || rec.author || '', changeNote: '', startedAt: new Date().toISOString()
      };
      persistDraft(); state.review = null;
      go('practice');
    } else if (act === 'delete') { state.confirmDelete = true; render(); }
    else if (act === 'cancel-delete') { state.confirmDelete = false; render(); }
    else if (act === 'confirm-delete') {
      const id = state.recordId;
      btn.disabled = true;
      try { await store.remove(id); toast('Deleted ' + id); go('records'); } catch (err) { btn.disabled = false; toast('Could not delete the record. Try again.'); }
    } else if (act === 'copy-md') {
      const rec = store.records.find((r) => r.id === state.recordId);
      if (!rec) return;
      const ok = await copyText(toMarkdown(rec));
      if (ok) toast('Copied ' + rec.id + ' as Markdown');
      else { const d = $('details.md'); if (d) { d.open = true; const sel = window.getSelection(); const range = document.createRange(); range.selectNodeContents($('#md-text')); sel.removeAllRanges(); sel.addRange(range); } toast('Copy is blocked here. The text is selected below: press Ctrl+C.'); }
    } else if (act === 'download-md') {
      const rec = store.records.find((r) => r.id === state.recordId);
      if (rec) offerDownload(rec.id + '.md', toMarkdown(rec));
    } else if (act === 'export-all') {
      offerDownload('documentation-records-' + ymd(new Date()) + '.json', JSON.stringify(store.records, null, 2));
    } else if (act === 'add-example') {
      const ex = SCENARIOS[0];
      const date = ymd(new Date());
      const m = modelRecord(ex, date);
      const now = new Date().toISOString();
      const rec = { id: nextId(TEMPLATES[ex.template].prefix), template: ex.template, scenarioId: ex.id, scenarioDate: date, fields: m.fields, timeline: m.timeline, author: 'Example', createdAt: now, updatedAt: now, version: 1, example: true,
        revisions: [{ v: 1, at: now, by: 'Example', note: 'Example record added' }], check: null };
      await store.save(rec);
      changed();
      toast('Example record added');
    }
  });

  app.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'rec-q') { state.filters.q = t.value; $('#rec-rows').innerHTML = recordRows(); return; }
    if (t.id === 'rec-type') { state.filters.type = t.value; $('#rec-rows').innerHTML = recordRows(); return; }
    if (t.id === 'rec-status') { state.filters.status = t.value; $('#rec-rows').innerHTML = recordRows(); return; }
    if (t.id === 'class-scenario') { state.cls.scenario = t.value; renderClassRows(); return; }
    if (t.id === 'class-sort') { state.cls.sort = t.value; renderClassRows(); return; }
    if (t.id === 'class-auto') { state.cls.auto = t.checked; syncAuto(); if (t.checked) classLoad(true); return; }
    if (t.id === 'share-scenario') { state.cls.share = t.value; render(); return; }
    if (!draft) return;
    if (t.dataset.field) draft.fields[t.dataset.field] = t.value;
    else if (t.dataset.tl) { const entry = draft.timeline[Number(t.dataset.i)]; if (entry) entry[t.dataset.tl] = t.value; }
    else if (t.id === 'f-author') { draft.author = t.value; LS.set(KEY_AUTHOR, t.value); }
    else if (t.id === 'f-change') draft.changeNote = t.value;
    else return;
    const field = t.closest('.field.invalid'); if (field) field.classList.remove('invalid');
    saveDraftSoon();
  });

  app.addEventListener('submit', (e) => {
    if (e.target.dataset.form === 'class-code') { e.preventDefault(); classLoad(false); }
  });

  document.addEventListener('keydown', (e) => {
    if (state.view !== 'review' || !state.cls.openId || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const btn = $('[data-action="class-' + (e.key === 'ArrowRight' ? 'next' : 'prev') + '"]');
      if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
    }
  });

  app.addEventListener('change', (e) => {
    const t = e.target;
    if (!draft || !(t.dataset.kind === 'datetime' || t.dataset.tl === 't')) return;
    const norm = t.dataset.kind === 'datetime' ? normDT(t.value) : normTime(t.value);
    if (norm === null) {
      t.setAttribute('aria-invalid', 'true');
      toast(t.dataset.kind === 'datetime' ? 'Write the date and time as YYYY-MM-DD HH:MM, e.g. ' + nowLocal() + '.' : 'Write the time as HH:MM in 24-hour format, e.g. 14:05.');
      return;
    }
    t.removeAttribute('aria-invalid');
    t.value = norm;
    if (t.dataset.kind === 'datetime') draft.fields[t.dataset.field] = norm;
    else { const entry = draft.timeline[Number(t.dataset.i)]; if (entry) entry.t = norm; }
    saveDraftSoon();
  });

  document.addEventListener('keydown', (e) => {
    if (!e.ctrlKey || e.altKey || e.shiftKey || e.metaKey || String(e.key).toLowerCase() !== 'g') return;
    const t = document.activeElement;
    if (state.view !== 'practice' || state.review || !draft || !draft.scenarioId || !t || !app.contains(t)) return;
    if (!t.dataset.field && !t.dataset.tl) return;
    e.preventDefault();
    const m = modelRecord(scenarioById(draft.scenarioId), draft.scenarioDate);
    let v = '';
    if (t.dataset.field) v = m.fields[t.dataset.field] || '';
    else { const entry = m.timeline[Number(t.dataset.i)]; v = entry ? entry[t.dataset.tl] || '' : ''; }
    if (!v) return;
    t.value = v;
    t.removeAttribute('aria-invalid');
    t.dispatchEvent(new Event('input', { bubbles: true }));
  });

  /* ------------------------------------------------------------------ clock */
  function tick() {
    const d = new Date();
    $('#clock-date').textContent = DAYS[d.getDay()].slice(0, 3) + ' ' + ymd(d);
    $('#clock-time').textContent = d.toTimeString().slice(0, 8);
    $('#clock-tz').textContent = tzLabel;
  }

  /* ------------------------------------------------------------------- boot */
  loadDraft();
  if (draft && !TEMPLATES[draft.template]) clearDraft();
  tick();
  setInterval(tick, 1000);
  window.addEventListener('hashchange', route);
  route();
  store.init();
})();
</script>
<!-- app:end -->
</body>
</html>
